<!DOCTYPE html>
<html lang="en">
<head>


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Page</title>
   <link rel="icon" type="image/png" href="images/github-logo.png">

  <!-- daisy and tailwind -->

<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>



<!-- font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">


<!-- icons -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<style>
  * {
    font-family: "Geist", sans-serif;
  }
</style>



</head>
<body class="bg-[#F3F4F6] min-h-screen">
<header>
<div class="navbar bg-base-100 shadow-sm p-3">

  <!-- left -->
  <div class="flex flex-1 items-center gap-2">
    <img class="w-10 h-10" src="images/github-logo.png" alt="GitHub Logo">
    <h2 class="font-semibold text-[#1F2937]">Github Issues Tracker</h2>
  </div>
  <!-- right -->
  <div class="flex gap-2 items-center">
    <input id="searchInput" type="text" placeholder="Search issues..." class="input input-bordered  md:w-auto" />
    <button class="btn btn-primary">
      <i class="fas fa-plus"></i>New Issue
    </button>
  </div>
</div>
</header>

<section class="w-11/12 mx-auto py-3 flex justify-between items-center bg-[#FFFFFF] mt-[2rem] rounded-xl">
<!-- buttons -->
     <div class="flex gap-2 p-3">
      <button id="all-filter-btn"  class="text-[.9rem] font-semibold text-[#64748B] border border-[#64748B] p-3 rounded-xl w-20 filter-btn active-btn" >All</button>
      <button id="open-filter-btn"  class="p-3 text-[.9rem] filter-btn text-[#64748B] border border-[#64748B] hover:bg-black hover:text-white hover:border-black rounded-xl w-20" >Open</button>
      <button id="closed-filter-btn"  class="p-3 text-[.9rem] filter-btn text-[#64748B] border border-[#64748B] hover:bg-black hover:text-white hover:border-black rounded-xl w-20" >Closed</button>
     </div>
  
</section>

<section class="w-11/12 mx-auto bg-white rounded-xl p-4 mt-4 shadow-sm flex justify-between items-center">

 <!-- Left -->
  <div class="flex items-center gap-3">
    
    <!-- Icon -->
    <div class="bg-purple-100 text-purple-600 p-2 rounded-full">
      <i class="fas fa-layer-group"></i>
    </div>

    <!-- Text -->
    <div>
      <h3 id="issue-count" class="font-semibold text-gray-800">0 Issues</h3>
      <p class="text-xs text-gray-500">Track and manage your project issues</p>
    </div>

  </div>

  <!-- Right -->
  <div class="flex items-center gap-4 text-sm">
    
    <div class="flex items-center gap-1">
      <span class="w-2 h-2 bg-green-500 rounded-full"></span>
      <span id="open-count" class="text-gray-600">Open</span>
    </div>

    <div class="flex items-center gap-1">
      <span class="w-2 h-2 bg-purple-500 rounded-full"></span>
      <span id="closed-count" class="text-gray-600">Closed</span>
    </div>

  </div>

</section>

<section class="container w-11/12 mx-auto rounded-xl bg-[#FBFBFB] mt-[2rem]">
  <div id="spinner" class="hidden flex justify-center items-center py-10">
  <span class="loading loading-spinner loading-lg text-purple-600"></span>
</div>
  <div id="issues-container" class="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-4 gap-8 px-5 py-5"></div>
</section>

<section id="single-container" class="fixed inset-0 bg-black/40 flex items-center justify-center hidden z-50">
 
</section>

</body>
<script src="script/spinner.js"></script>
<script src="script/home.js"></script>
<script src="script/buttontoggling.js"></script>
</html>
