<!DOCTYPE html>
<html lang="en">
<head>


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Page</title>
   <link rel="icon" type="image/png" href="images/github-logo.png">

  <!-- daisy and tailwind -->

<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>



<!-- font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">


<!-- icons -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<style>
  * {
    font-family: "Geist", sans-serif;
  }
</style>



</head>
<body class="bg-[#F3F4F6] min-h-screen">
<header>
<div class="navbar bg-base-100 shadow-sm p-3">

  <!-- left -->
  <div class="flex flex-1 items-center gap-2">
    <img class="w-10 h-10" src="images/github-logo.png" alt="GitHub Logo">
    <h2 class="font-semibold text-[#1F2937]">Github Issues Tracker</h2>
  </div>
  <!-- right -->
  <div class="flex gap-2 items-center">
    <input type="text" placeholder="Search issues..." class="input input-bordered  md:w-auto" />
    <button class="btn btn-primary">
      <i class="fas fa-plus"></i>New Issue
    </button>
  </div>
</div>
</header>

<section class="w-11/12 mx-auto py-3 flex justify-between items-center bg-[#FFFFFF] mt-[2rem] rounded-xl">
<!-- buttons -->
     <div class="flex gap-2 p-3">
      <button id="all-filter-btn" onclick="toogleStyle('all-filter-btn')" class="text-[.9rem] font-semibold text-[#FFFFFF] bg-[#4A00FF] p-3 rounded-xl w-20 filter-btn active-btn" >All</button>
      <button id="open-filter-btn" onclick="toogleStyle('open-filter-btn')" class="p-3 text-[.9rem] filter-btn text-[#64748B] border border-[#64748B] hover:bg-black hover:text-white hover:border-black rounded-xl w-20" >Open</button>
      <button id="closed-filter-btn" onclick="toogleStyle('closed-filter-btn')" class="p-3 text-[.9rem] filter-btn text-[#64748B] border border-[#64748B] hover:bg-black hover:text-white hover:border-black rounded-xl w-20" >Closed</button>
     </div>
  
</section>

<section class="container w-11/12 mx-auto rounded-xl bg-[#F8FAFC] mt-[2rem]">
  <div id="issues-container" class="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-4 gap-8 px-5 py-5"></div>
</section>

<script src="script/buttontoggling.js"></script>
<script src="script/home.js"></script>
</body>
</html>
